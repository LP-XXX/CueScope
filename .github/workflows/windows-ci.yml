name: Windows CI
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CUESCOPE_HEADLESS_CI: '1'
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/capture-requirements.lock
      - name: Install locked runtimes and verify models
        run: python tools/bootstrap.py
      - name: Run offline regression and lint
        run: python tools/verify.py
      - name: Retain offline results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-offline-results
          path: |
            build/validation/pytest.xml
            build/validation/automated-tests.json
          if-no-files-found: warn
          retention-days: 7
