name: Windows draft release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      CUESCOPE_HEADLESS_CI: '1'
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.lock
            packaging/capture-requirements.lock
      - run: python tools/bootstrap.py
      - name: Build tagged source, verify evidence, smoke-test the extracted ZIP
        run: python tools/build_release.py --dist-root build/release --tag "$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-release
          path: |
            build/release/CueScope-*-win-x64.zip
            build/release/CueScope-*-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: portable-release
          path: assets
      - name: Create draft with checked assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check CueScope-*-win-x64.zip.sha256
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" CueScope-*-win-x64.zip CueScope-*-win-x64.zip.sha256
