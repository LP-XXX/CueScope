name: 提出使用场景
description: 说明你希望软件帮你完成哪件事
title: "[需求] "
body:
  - type: input
    id: goal
    attributes:
      label: 想解决什么具体问题
      placeholder: "例如导出任务完成后，希望手机上的某个应用提醒我"
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: 目前如何做，在哪一步遇到困难
      description: "可举一个人工编写的例子，写明使用频率、期望收到提醒的位置和你如何判断成功。请省略私人文字和账号。"
    validations:
      required: true
